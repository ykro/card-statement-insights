<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bimonetary-decision-flow-title bimonetary-decision-flow-desc" id="bimonetary-decision-flow-root">
      <title id="bimonetary-decision-flow-title">Separacion bimonetaria y generacion de decisiones financieras</title>
      <desc id="bimonetary-decision-flow-desc">Clasificacion de las transacciones del estado de cuenta en tres canales simultaneos (Quetzales Q, Dolares USD y Extrafinanciamiento FIN) hacia el motor de decisiones.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #bimonetary-decision-flow-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #bimonetary-decision-flow-root { font-family: var(--font-sans); color: var(--color-ink); }</style>
        <pattern id="bimonetary-decision-flow-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
        </pattern>
        <marker id="bimonetary-decision-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="bimonetary-decision-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="bimonetary-decision-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#bimonetary-decision-flow-dots)" opacity="0.55"/>

      <!-- Zone: 3 Simultaneous Statement Ledgers -->
      <rect x="336" y="76" width="248" height="316" rx="8"
            fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
      <rect x="396" y="80" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="460" y="89" fill="#2d3142" fill-opacity="0.45" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">SIMULTANEOUS LEDGERS</text>

      <!-- Arrows first (fanned 16px apart on right edge of PDF Token Stream and left edge of Decision Engine) -->
      <path d="M 224,220 H 272 Q 280,220 280,212 V 148 Q 280,140 288,140 H 364"
            fill="none" stroke="#2d3142" stroke-width="1.2" marker-end="url(#bimonetary-decision-flow-arrow)"/>
      <line x1="224" y1="236" x2="364" y2="236" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#bimonetary-decision-flow-arrow-accent)"/>
      <path d="M 224,252 H 272 Q 280,252 280,260 V 324 Q 280,332 288,332 H 364"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bimonetary-decision-flow-arrow)"/>

      <path d="M 556,140 H 632 Q 640,140 640,148 V 212 Q 640,220 648,220 H 716"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bimonetary-decision-flow-arrow)"/>
      <line x1="556" y1="236" x2="716" y2="236" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#bimonetary-decision-flow-arrow-accent)"/>
      <path d="M 556,332 H 632 Q 640,332 640,324 V 260 Q 640,252 648,252 H 716"
            fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#bimonetary-decision-flow-arrow)"/>

      <!-- Arrow labels (with 8px gap from lines) -->
      <rect x="288" y="120" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="318" y="129" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">58 CARGOS</text>

      <rect x="284" y="216" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="316" y="225" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">35 CARGOS</text>

      <rect x="288" y="340" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="318" y="349" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">8 CUOTAS</text>

      <rect x="648" y="216" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="676" y="225" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVIDENCE</text>

      <!-- Node 1: Statement Stream -->
      <rect x="48" y="204" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="204" width="176" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <rect x="56" y="212" width="32" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="72" y="221" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RAW</text>
      <text x="136" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Flujo Estado PDF</text>
      <text x="136" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Debits dx &lt; 340</text>

      <!-- Node 2: Movimientos en Quetzales -->
      <rect x="364" y="108" width="192" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="364" y="108" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="372" y="116" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="388" y="125" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GTQ</text>
      <text x="460" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Consumo Local (Q)</text>
      <text x="460" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Q11,344.19 · 58 tx</text>

      <!-- Node 3: Movimientos en Dolares -->
      <rect x="364" y="204" width="192" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="364" y="204" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="372" y="212" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="388" y="221" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USD</text>
      <text x="460" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Consumo Digital / Viajes ($)</text>
      <text x="460" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">$2,910.73 · 35 tx</text>

      <!-- Node 4: Extrafinanciamientos -->
      <rect x="364" y="300" width="192" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="364" y="300" width="192" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="372" y="308" width="32" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.45" stroke-width="0.8"/>
      <text x="388" y="317" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FIN</text>
      <text x="460" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Extrafinanciamientos</text>
      <text x="460" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Q36,638.02 · FIN/CT+IN</text>

      <!-- Node 5: Informacion para Decidir (Focal Coral) -->
      <rect x="716" y="204" width="224" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="716" y="204" width="224" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="724" y="212" width="36" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="742" y="221" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DECIDE</text>
      <text x="828" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Informacion para Decidir</text>
      <text x="828" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4 Acciones Cuantificadas</text>

      <!-- Legend strip -->
      <line x1="48" y1="416" x2="952" y2="416" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="48" y="432" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="48" y="448" width="14" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="68" y="456" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision engine</text>

      <rect x="192" y="448" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="212" y="456" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Regular spend (Q / $)</text>

      <rect x="364" y="448" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="384" y="456" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Structured debt (FIN)</text>

      <rect x="536" y="448" width="14" height="10" rx="2" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <text x="556" y="456" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Raw PDF stream</text>

      <line x1="676" y1="454" x2="704" y2="454" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#bimonetary-decision-flow-arrow-accent)"/>
      <text x="712" y="456" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary USD / FX signal</text>

      <line x1="856" y1="454" x2="884" y2="454" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#bimonetary-decision-flow-arrow)"/>
      <text x="892" y="456" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Isolated from lifestyle</text>
    </svg>
