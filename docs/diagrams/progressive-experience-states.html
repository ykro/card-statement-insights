<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progresion de Profundidad 1 a 3+ Estados de Cuenta · Card Statement Insights</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State Progression · 1-to-3+ Statements</p>
    <h1>Experiencia progresiva desde 1 PDF hasta tendencias de 3 meses</h1>

    <svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="progressive-experience-states-title progressive-experience-states-desc">
      <title id="progressive-experience-states-title">Progresion de estados desde 1 estado de cuenta hasta 3 meses</title>
      <desc id="progressive-experience-states-desc">Transicion entre la pantalla de carga inicial y los tres niveles de profundidad analitica: radiografia de 1 mes, comparativo de 2 meses y motor de tendencias de 3 meses.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Zone: Screen 2 Executive Dashboard -->
      <rect x="244" y="128" width="716" height="224" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <rect x="528" y="132" width="148" height="12" rx="2" fill="#f5f5f5"/>
      <text x="602" y="141" fill="rgba(45,49,66,0.45)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">SCREEN 2: DASHBOARD</text>

      <!-- Arrows first -->
      <line x1="184" y1="232" x2="268" y2="232" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="444" y1="232" x2="508" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="684" y1="232" x2="748" y2="232" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Direct 3-PDF shortcut above nodes using orthogonal r=8 elbows -->
      <path d="M 112,200 V 96 Q 112,88 120,88 H 832 Q 840,88 840,96 V 200"
            fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

      <!-- Arrow labels (with 8px gap from strokes) -->
      <rect x="196" y="212" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="222" y="221" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">1 PDF</text>

      <rect x="452" y="212" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="476" y="221" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">+1 MES</text>

      <rect x="692" y="212" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="716" y="221" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">+1 MES</text>

      <rect x="420" y="68" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="476" y="77" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DROP 3 PDFS</text>

      <!-- Node 1: Screen 1 Upload -->
      <rect x="40" y="200" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="200" width="144" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="208" width="36" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="66" y="217" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
      <text x="112" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Screen 1: Ingesta</text>
      <text x="112" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PDF Dropzone</text>

      <!-- Node 2: Mode 1/3 Snapshot -->
      <rect x="268" y="200" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="268" y="200" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="276" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <text x="290" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">1/3</text>
      <text x="436" y="260" fill="rgba(45,49,66,0.06)" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">01</text>
      <text x="356" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Radiografia 1 Mes</text>
      <text x="356" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Q + $ · Weekly Velocity</text>

      <!-- Node 3: Mode 2/3 Comparative -->
      <rect x="508" y="200" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="508" y="200" width="176" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="516" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.45)" stroke-width="0.8"/>
      <text x="530" y="217" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">2/3</text>
      <text x="676" y="260" fill="rgba(45,49,66,0.06)" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">02</text>
      <text x="596" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Comparativo 2M</text>
      <text x="596" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Delta MoM %</text>

      <!-- Node 4: Mode 3/3 Trends Engine (Focal Coral) -->
      <rect x="748" y="200" width="192" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="748" y="200" width="192" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="756" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="770" y="217" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">3/3</text>
      <text x="932" y="260" fill="rgba(235,108,54,0.10)" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">03</text>
      <text x="844" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Motor Tendencias 3M</text>
      <text x="844" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Creep · Subs · Decisions</text>

      <!-- Legend strip -->
      <line x1="40" y1="384" x2="960" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="400" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="416" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Optimal 3M state</text>

      <rect x="192" y="416" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="212" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">1M snapshot</text>

      <rect x="328" y="416" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="348" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">2M comparative</text>

      <rect x="476" y="416" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="496" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Upload screen</text>

      <line x1="612" y1="422" x2="640" y2="422" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="648" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Trend unlock</text>

      <line x1="756" y1="422" x2="784" y2="422" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <text x="792" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Batch 3-PDF upload</text>
    </svg>
  </div>
</body>
</html>
